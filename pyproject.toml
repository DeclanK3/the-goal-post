[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goalpost"
version = "0.1.0"
description = "NFL drive modeling via team representations and transition simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "polars>=0.20",
    "nflreadpy>=0.1",
    "flask>=3.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/goalpost"]
